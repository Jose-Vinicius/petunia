pt-BR:
  date:
    formats:
      default: "%d/%m/%y"
      short: "%d/%m/%y"
      long: "%d de %B de %Y"
  time:
    formats:
      default: "%d/%m/%y %H:%M"
      short: "%d/%m/%y"
      long: "%d de %B de %Y, %H:%M"
  number:
    format:
      separator: ","
      delimiter: "."
      precision: 2
      significant: false
      strip_insignificant_zeros: false
    currency:
      format:
        unit: "R$ "
        format: "%u%n"
        separator: ","
        delimiter: "."
        precision: 2
        significant: false
        strip_insignificant_zeros: false
  app:
    name: "Petunia"
