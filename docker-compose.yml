name: petunia

services:
  web:
    container_name: petunia-web-1
    build: .
    image: ${DOCKER_IMAGE:-ghcr.io/jose-vinicius/petunia:latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-db}:5432/${POSTGRES_DB}}
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      AI_API_KEY: ${AI_API_KEY}
    ports:
      - "${PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    volumes:
      - rails_storage:/rails/storage
    networks:
      - default
      - azaleia_net

  worker:
    container_name: petunia-worker-1
    build: .
    image: ${DOCKER_IMAGE:-ghcr.io/jose-vinicius/petunia:latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-db}:5432/${POSTGRES_DB}}
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      AI_API_KEY: ${AI_API_KEY}
    command: ["./bin/jobs"]
    volumes:
      - rails_storage:/rails/storage
    networks:
      - default
      - azaleia_net

volumes:
  rails_storage:

networks:
  azaleia_net:
    external: true
    name: azaleia_default
